<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAG Compare</title>
    <link rel="stylesheet" href="/static/styles.css">
    <link rel="stylesheet" href="/static/compare.css">
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
</head>
<body class="compare-page">
    <header class="compare-header">
        <h1>Compare Chat — Vanilla vs RAG</h1>
        <a href="/" class="back-link">&larr; Single-pane mode</a>
    </header>

    <section class="compare-input-bar">
        <textarea id="sharedInput" placeholder="Ask anything — same question goes to both panels..." rows="2"></textarea>
        <button id="sharedSend">Send &rarr;</button>
    </section>

    <main class="compare-panels">
        <section class="compare-panel" id="vanillaPanel">
            <header class="panel-header">
                <h2>Vanilla</h2>
                <span class="panel-subtitle" id="vanillaConvIdLabel"></span>
            </header>
            <div class="panel-messages" id="vanillaMessages"></div>
        </section>

        <section class="compare-panel rag-panel" id="ragPanel">
            <header class="panel-header">
                <h2>RAG</h2>
                <span class="panel-subtitle" id="ragConvIdLabel"></span>
                <label class="sources-toggle">
                    <input type="checkbox" id="showSources" checked>
                    Show sources
                </label>
                <label class="upload-button" title="Upload a file for this conversation">
                    Upload
                    <input type="file" id="ragUpload" hidden>
                </label>
            </header>
            <div class="panel-messages" id="ragMessages"></div>
        </section>
    </main>

    <script type="module" src="/static/compare.js"></script>
</body>
</html>
