<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neural Chat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/styles.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/streaming-markdown@0.2.15/smd.min.js"></script>
</head>
<body>
    <div class="sidebar" id="sidebar">
        <div class="sidebar-tabs" id="sidebarTabs">
            <button class="sidebar-tab active" data-tab="conversations">Conversations</button>
            <button class="sidebar-tab" data-tab="library" id="libraryTabBtn" hidden>Library</button>
        </div>
        <div class="sidebar-header" id="sidebarHeader"></div>
        <div class="conversation-list" id="conversationList"></div>
        <div class="library-view" id="libraryView" hidden></div>
    </div>

    <div class="main-content">
        <div class="chat-container">
            <div class="chat-header">
                <button class="toggle-sidebar" id="toggleSidebarMain">&#9776;</button>
                <span>Neural Chat — Side-by-Side Compare</span>
            </div>

            <!-- Side-by-side comparison layout (RAG iteration 7). Two
                 message columns share a single input box. Each column has
                 its own Upload button in its header, bound to that
                 column's conversation_id. One Send fires two parallel POSTs:
                 vanilla column with retrieval=null, RAG column with
                 retrieval={library,uploads,top_k}. The RAG column is hidden
                 via .rag-disabled when RAG_ENABLED=false. -->
            <div class="compare-grid" id="compareGrid">
                <section class="column" data-channel="vanilla">
                    <div class="column-header">
                        <span class="column-title">Vanilla</span>
                        <label class="upload-btn" title="Upload a file to the vanilla conversation (small files go inline; large files are indexed)">
                            Upload
                            <input type="file" class="upload-input" data-column="vanilla" accept=".md,.txt,.pdf,.html,.docx,.csv">
                        </label>
                    </div>
                    <div class="column-messages" id="vanillaMessages"></div>
                </section>
                <section class="column rag-column" id="ragColumn" data-channel="rag">
                    <div class="column-header">
                        <span class="column-title">RAG</span>
                        <label class="show-sources-toggle" title="Toggle visibility of retrieved-source citations in this column">
                            <input type="checkbox" id="showSourcesToggle" checked>
                            Show sources
                        </label>
                        <label class="upload-btn" title="Upload a file to the RAG conversation (small files go inline; large files are indexed)">
                            Upload
                            <input type="file" class="upload-input" data-column="rag" accept=".md,.txt,.pdf,.html,.docx,.csv">
                        </label>
                    </div>
                    <div class="column-messages" id="ragMessages"></div>
                </section>
            </div>

            <div class="chat-input-container">
                <textarea class="chat-input" id="messageInput" placeholder="Type your message..." rows="1"></textarea>
                <button class="send-button" id="sendButton">Send</button>
            </div>
        </div>
    </div>

    <div class="modal-backdrop" id="confirmModal" hidden>
        <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
            <h3 class="modal-title" id="modalTitle"></h3>
            <div class="modal-message" id="modalMessage"></div>
            <div class="modal-actions">
                <button class="modal-cancel" id="modalCancelBtn"></button>
                <button class="modal-confirm" id="modalConfirmBtn"></button>
            </div>
        </div>
    </div>

    <script type="module" src="/static/app.js"></script>
</body>
</html>
