<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neural Chat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        :root {
            --bg-primary: #0a0e17;
            --bg-secondary: #111827;
            --bg-tertiary: #1a2234;
            --bg-card: #141b2d;
            --accent-cyan: #00d4ff;
            --accent-purple: #8b5cf6;
            --accent-blue: #3b82f6;
            --text-primary: #e2e8f0;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --border-color: #1e293b;
            --glow-cyan: 0 0 20px rgba(0, 212, 255, 0.3);
            --glow-purple: 0 0 20px rgba(139, 92, 246, 0.3);
        }
        body {
            font-family: 'Exo 2', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            background-image:
                radial-gradient(ellipse at 20% 80%, rgba(0, 212, 255, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 20%, rgba(139, 92, 246, 0.08) 0%, transparent 50%);
            height: 100vh;
            display: flex;
            color: var(--text-primary);
        }
        /* Animated grid background */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image:
                linear-gradient(rgba(0, 212, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 212, 255, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none;
            z-index: 0;
        }
        .sidebar {
            width: 280px;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            transition: margin-left 0.3s;
            position: relative;
            z-index: 10;
        }
        .sidebar.collapsed {
            margin-left: -280px;
        }
        .sidebar-header {
            padding: 16px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .new-chat-btn {
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
            color: var(--bg-primary);
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            font-family: inherit;
            transition: all 0.2s ease;
            box-shadow: var(--glow-cyan);
        }
        .new-chat-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.5);
        }
        .toggle-sidebar {
            background: none;
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            font-size: 18px;
            cursor: pointer;
            padding: 6px 10px;
            border-radius: 6px;
            transition: all 0.2s ease;
        }
        .toggle-sidebar:hover {
            border-color: var(--accent-cyan);
            color: var(--accent-cyan);
        }
        .conversation-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }
        .conversation-list::-webkit-scrollbar {
            width: 6px;
        }
        .conversation-list::-webkit-scrollbar-track {
            background: transparent;
        }
        .conversation-list::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 3px;
        }
        .conversation-item {
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
            border: 1px solid transparent;
            transition: all 0.2s ease;
        }
        .conversation-item:hover {
            background: var(--bg-tertiary);
            border-color: var(--border-color);
        }
        .conversation-item.active {
            background: linear-gradient(135deg, rgba(0, 212, 255, 0.15), rgba(139, 92, 246, 0.15));
            border-color: var(--accent-cyan);
            box-shadow: inset 0 0 20px rgba(0, 212, 255, 0.1);
        }
        .conversation-item .title {
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-size: 14px;
            color: var(--text-secondary);
        }
        .conversation-item.active .title {
            color: var(--accent-cyan);
        }
        .conversation-item .delete-btn {
            opacity: 0;
            background: none;
            border: none;
            color: #ef4444;
            cursor: pointer;
            padding: 4px 8px;
            font-size: 18px;
            transition: all 0.2s ease;
        }
        .conversation-item:hover .delete-btn {
            opacity: 1;
        }
        .conversation-item .delete-btn:hover {
            color: #f87171;
        }
        .conversation-item .streaming-badge {
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
            color: var(--bg-primary);
            font-size: 10px;
            font-weight: 600;
            padding: 3px 8px;
            border-radius: 12px;
            margin-left: 8px;
            animation: pulse-glow 2s infinite;
        }
        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 5px rgba(0, 212, 255, 0.5); }
            50% { box-shadow: 0 0 15px rgba(0, 212, 255, 0.8); }
        }
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            z-index: 1;
        }
        .chat-container {
            max-width: 1100px;
            width: 100%;
            display: flex;
            flex-direction: column;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            margin: 16px;
            overflow: hidden;
            box-shadow:
                0 0 40px rgba(0, 0, 0, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }
        .chat-header {
            padding: 20px 24px;
            background: linear-gradient(180deg, var(--bg-tertiary) 0%, var(--bg-card) 100%);
            border-bottom: 1px solid var(--border-color);
            font-size: 18px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--text-primary);
        }
        .chat-header::before {
            content: '';
            width: 8px;
            height: 8px;
            background: var(--accent-cyan);
            border-radius: 50%;
            box-shadow: var(--glow-cyan);
            animation: pulse-glow 2s infinite;
        }
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            background: transparent;
        }
        .chat-messages::-webkit-scrollbar {
            width: 8px;
        }
        .chat-messages::-webkit-scrollbar-track {
            background: transparent;
        }
        .chat-messages::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 4px;
        }
        /* Empty state - centered input */
        .chat-messages.empty {
            justify-content: center;
            align-items: center;
        }
        .chat-messages:not(.empty) {
            justify-content: flex-start;
        }
        /* Message wrapper - handles alignment and contains avatar + bubble */
        .message-wrapper {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            max-width: 80%;
        }
        .message-wrapper.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }
        .message-wrapper.assistant {
            align-self: flex-start;
            flex-direction: row;
        }
        /* Message bubble - contains content only */
        .message {
            padding: 14px 18px;
            border-radius: 16px;
            line-height: 1.6;
            overflow-y: visible;
            position: relative;
            flex: 1;
            min-width: 0;
        }
        .message.user {
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
            color: var(--bg-primary);
            border-bottom-right-radius: 4px;
            font-weight: 500;
            box-shadow: var(--glow-cyan);
        }
        .message.assistant {
            background: var(--bg-tertiary);
            color: var(--text-primary);
            border-bottom-left-radius: 4px;
            border: 1px solid var(--border-color);
        }
        /* Avatar - outside bubble as sibling */
        .avatar {
            flex-shrink: 0;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .message-wrapper.assistant .avatar {
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-blue));
        }
        .message-wrapper.user .avatar {
            background: rgba(0, 0, 0, 0.2);
        }
        .avatar svg {
            width: 18px;
            height: 18px;
        }
        .message-wrapper.assistant .avatar svg {
            stroke: white;
        }
        .message-wrapper.user .avatar svg {
            stroke: var(--accent-cyan);
        }
        .message-body {
            flex: 1;
            min-width: 0;
        }
        /* Thinking section */
        .thinking-section {
            margin-bottom: 10px;
            padding: 10px 12px;
            background: rgba(0, 212, 255, 0.05);
            border-radius: 8px;
            font-size: 13px;
            color: var(--text-muted);
            border-left: 2px solid var(--accent-cyan);
        }
        .thinking-content {
            white-space: pre-wrap;
            word-break: break-word;
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
        }
        .thinking-collapsed .thinking-content {
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .thinking-toggle {
            background: none;
            border: none;
            color: var(--accent-cyan);
            font-size: 12px;
            cursor: pointer;
            padding: 4px 0;
            margin-top: 6px;
            font-family: inherit;
            transition: color 0.2s ease;
        }
        .thinking-toggle:hover {
            color: var(--text-primary);
        }
        /* Message content - markdown */
        .message-content {
            white-space: pre-wrap;
            word-break: break-word;
        }
        .message-content.loading {
            white-space: normal;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text-muted);
            font-size: 14px;
        }
        .message-content.loading .loading-dots {
            display: flex;
            gap: 5px;
        }
        .message-content.loading .loading-dots span {
            width: 8px;
            height: 8px;
            background: var(--accent-cyan);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
            box-shadow: var(--glow-cyan);
        }
        .message-content.loading .loading-dots span:nth-child(1) { animation-delay: -0.32s; }
        .message-content.loading .loading-dots span:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }
        .message-content code {
            background: rgba(0, 212, 255, 0.1);
            padding: 2px 8px;
            border-radius: 4px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            color: var(--accent-cyan);
            border: 1px solid rgba(0, 212, 255, 0.2);
        }
        .message-content pre {
            background: var(--bg-primary);
            color: var(--text-primary);
            padding: 14px;
            border-radius: 10px;
            overflow-x: auto;
            margin: 10px 0;
            border: 1px solid var(--border-color);
            box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.3);
        }
        .message-content pre code {
            background: none;
            padding: 0;
            color: inherit;
            border: none;
        }
        .message-content a {
            color: var(--accent-cyan);
            text-decoration: none;
            border-bottom: 1px solid rgba(0, 212, 255, 0.3);
            transition: all 0.2s ease;
        }
        .message-content a:hover {
            border-bottom-color: var(--accent-cyan);
        }
        .message-content ul, .message-content ol {
            margin-left: 20px;
        }
        .message-content li {
            margin: 4px 0;
        }
        /* Table styles */
        .message-content table {
            border-collapse: collapse;
            width: 100%;
            margin: 12px 0;
            font-size: 14px;
        }
        .message-content th, .message-content td {
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            text-align: left;
        }
        .message-content th {
            background: var(--bg-tertiary);
            font-weight: 600;
            color: var(--accent-cyan);
        }
        .message-content tr:nth-child(even) {
            background: rgba(255, 255, 255, 0.02);
        }
        /* KaTeX math blocks */
        .message-content .katex-display {
            margin: 12px 0;
            overflow-x: auto;
            overflow-y: hidden;
            padding: 8px 0;
        }
        .message-content .katex {
            font-size: 1.1em;
        }
        .message-content .math-error {
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
            padding: 8px 12px;
            border-radius: 6px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }
        .chat-input-container {
            padding: 20px 24px;
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 14px;
            background: var(--bg-card);
        }
        .chat-input {
            flex: 1;
            padding: 14px 18px;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            font-size: 14px;
            outline: none;
            font-family: inherit;
            background: var(--bg-tertiary);
            color: var(--text-primary);
            field-sizing: content;
            min-height: 52px;
            max-height: 50vh;
            overflow-y: auto;
            resize: none;
            line-height: 1.5;
            transition: all 0.2s ease;
        }
        .chat-input::placeholder {
            color: var(--text-muted);
        }
        .chat-input:focus {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 0 3px rgba(0, 212, 255, 0.1), var(--glow-cyan);
        }
        .send-button {
            padding: 14px 28px;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
            color: var(--bg-primary);
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            align-self: flex-end;
            font-family: inherit;
            box-shadow: var(--glow-cyan);
        }
        .send-button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.6);
        }
        .send-button:disabled {
            background: var(--bg-tertiary);
            color: var(--text-muted);
            cursor: not-allowed;
            box-shadow: none;
        }
        .loading {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text-muted);
            font-size: 14px;
        }
        .loading-dots {
            display: flex;
            gap: 5px;
        }
        .loading-dots span {
            width: 8px;
            height: 8px;
            background: var(--accent-cyan);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
            box-shadow: var(--glow-cyan);
        }
        .loading-dots span:nth-child(1) { animation-delay: -0.32s; }
        .loading-dots span:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }
        /* Responsive */
        @media (max-width: 768px) {
            .chat-container {
                margin: 8px;
                border-radius: 12px;
            }
            .chat-messages {
                padding: 16px;
            }
            .message-wrapper {
                max-width: 90%;
            }
        }
        /* Reduced motion */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked@9/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/streaming-markdown@0.2.15/smd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.0/dist/purify.es.mjs"></script>
</head>
<body>
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <button class="new-chat-btn" id="newChatBtn">+ New Chat</button>
            <button class="toggle-sidebar" id="toggleSidebar">&#9776;</button>
        </div>
        <div class="conversation-list" id="conversationList"></div>
    </div>

    <div class="main-content">
        <div class="chat-container">
            <div class="chat-header">
                <button class="toggle-sidebar" id="toggleSidebarMain">&#9776;</button>
                <span>Neural Chat</span>
            </div>
            <div class="chat-messages" id="messages"></div>
            <div class="chat-input-container">
                <textarea class="chat-input" id="messageInput" placeholder="Type your message..." rows="1"></textarea>
                <button class="send-button" id="sendButton">Send</button>
            </div>
        </div>
    </div>

    <script type="module">
        import * as smd from "https://cdn.jsdelivr.net/npm/streaming-markdown/smd.min.js";
        marked.setOptions({ mangle: false, headerIds: false });

        const STORAGE_KEYS = {
            CHUNKS: (convId) => `chunks_${convId}`,
            POINTER: (convId) => `pointer_${convId}`,
            STREAMING: (convId) => `streaming_${convId}`,
            HISTORY: (convId) => `history_${convId}`
        };

        const messagesContainer = document.getElementById('messages');
        const messageInput = document.getElementById('messageInput');
        const sendButton = document.getElementById('sendButton');
        const sidebar = document.getElementById('sidebar');
        const conversationList = document.getElementById('conversationList');
        const newChatBtn = document.getElementById('newChatBtn');
        const toggleSidebar = document.getElementById('toggleSidebar');
        const toggleSidebarMain = document.getElementById('toggleSidebarMain');

        let currentConversationId = localStorage.getItem('currentConversationId');
        let conversations = {};

        function applyLaTeX(div) {
            // Manually render inline math in <equation-inline> tags
            div.querySelectorAll('equation-inline').forEach(el => {
            katex.render(el.textContent, el, {
                displayMode: false,  // Inline mode
                throwOnError: false  // Optional: Don't throw errors on invalid LaTeX
            });
            });
            // Manually render block math in <equation-block> tags
            div.querySelectorAll('equation-block').forEach(el => {
            katex.render(el.textContent, el, {
                displayMode: true,   // Display (block) mode
                throwOnError: false  // Optional: Don't throw errors on invalid LaTeX
            });
            });
        }

        function renderContent(div, content, renderer=null, parser=null){
            if (!content || !content.trim()) return '';
            if (!(renderer && parser)){
                renderer = smd.default_renderer(div);
                parser = smd.parser(renderer);
            }
            DOMPurify(content);
            smd.parser_write(parser, content);
            applyLaTeX(div);
            return [renderer, parser];
        }

        function end_parser(smd, parser){
            if (smd && parser) smd.parser_end(parser);
        }

        // Simple markdown rendering with marked + DOMPurify
        function renderMarkdown(content) {
            if (!content || !content.trim()) return '';
            const rawHtml = marked.parse(content);
            return DOMPurify.sanitize(rawHtml, {
                ALLOWED_TAGS: ['p', 'em', 'strong', 'a', 'code', 'pre', 'ul', 'ol', 'li', 'h1', 'h2', 'h3', 'table', 'thead', 'tbody', 'tr', 'th', 'td'],
                ALLOWED_ATTR: ['href', 'class'],
                ALLOWED_URI_REGEXP: /^(?:https?|mailto):/i,
            });
        }

        // Per-conversation streaming state helpers
        function isStreamingForConv(convId) {
            return localStorage.getItem(STORAGE_KEYS.STREAMING(convId)) === 'true';
        }
        function setStreamingForConv(convId, value) {
            if (convId) {
                localStorage.setItem(STORAGE_KEYS.STREAMING(convId), value ? 'true' : 'false');
            }
        }

        // Get history cache for a conversation
        function getHistoryCache(convId) {
            const cached = localStorage.getItem(STORAGE_KEYS.HISTORY(convId));
            return cached ? JSON.parse(cached) : null;
        }

        // Set history cache for a conversation
        function setHistoryCache(convId, messages) {
            localStorage.setItem(STORAGE_KEYS.HISTORY(convId), JSON.stringify(messages));
        }

        // Append a message to history cache
        function appendToHistoryCache(convId, message) {
            const cache = getHistoryCache(convId) || [];
            cache.push(message);
            setHistoryCache(convId, cache);
        }

        // Clear history cache for a conversation
        function clearHistoryCache(convId) {
            localStorage.removeItem(STORAGE_KEYS.HISTORY(convId));
        }

        // Initialize
        async function init() {
            await loadConversationList();

            if (currentConversationId) {
                // Check if stream is still active
                status = await checkStreamStatus();
                // skip the history if it is active
                if (status === true) return;
                // Load displayed content from history
                await loadConversation(currentConversationId);
            } else {
                messagesContainer.classList.add('empty');
            }
        }

        // Load conversation list
        async function loadConversationList() {
            try {
                const response = await fetch('/api/chat/conversations');
                const data = await response.json();
                conversations = {};
                conversationList.innerHTML = '';

                for (const conv of data.conversations) {
                    conversations[conv.conversation_id] = conv;
                    addConversationToList(conv);
                }
            } catch (error) {
                console.error('Failed to load conversations:', error);
            }
        }

        // Add conversation to sidebar list
        function addConversationToList(conv) {
            const div = document.createElement('div');
            div.className = 'conversation-item' + (conv.conversation_id === currentConversationId ? ' active' : '');
            div.dataset.id = conv.conversation_id;

            const titleSpan = document.createElement('span');
            titleSpan.className = 'title';
            titleSpan.textContent = conv.title || 'New conversation';

            const deleteBtn = document.createElement('button');
            deleteBtn.className = 'delete-btn';
            deleteBtn.textContent = '×';
            deleteBtn.onclick = (e) => {
                e.stopPropagation();
                deleteConversation(conv.conversation_id);
            };

            div.appendChild(titleSpan);
            div.appendChild(deleteBtn);
            div.onclick = () => switchConversation(conv.conversation_id);

            conversationList.appendChild(div);
        }

        // Switch to a conversation
        async function switchConversation(convId) {
            if (convId === currentConversationId) return;

            // Clear displayed messages first
            messagesContainer.innerHTML = '';

            currentConversationId = convId;
            localStorage.setItem('currentConversationId', convId);

            // Update active state in list
            document.querySelectorAll('.conversation-item').forEach(el => {
                el.classList.toggle('active', el.dataset.id === convId);
            });

            status = await checkStreamStatus();
            // if the conversation is resuming, skip the history logic
            if (status === true) return;
            await loadConversation(convId);
        }

        // Load conversation history
        async function loadConversation(convId) {
            try {
                // Check cache first
                const cached = getHistoryCache(convId);
                if (cached) {
                    // Render from cache — no fetch needed
                    renderMessagesFromCache(cached);
                    return;
                }

                // Fetch from backend
                const response = await fetch(`/api/chat/history/${convId}`);
                const data = await response.json();

                // Store in cache
                setHistoryCache(convId, data.messages);

                // Render
                renderMessagesFromCache(data.messages);
            } catch (error) {
                console.error('Failed to load conversation:', error);
            }
        }

        // Render messages from cache (or fetched data)
        function renderMessagesFromCache(messages) {
            messagesContainer.innerHTML = '';

            for (const msg of messages) {
                if (msg.role === 'assistant') {
                    const messageDiv = addMessage(msg.role, '');

                    // If there's thinking content, add it
                    if (msg.thinking) {
                        const thinkingContent = messageDiv.querySelector('.thinking-content');
                        if (thinkingContent) {
                            thinkingContent.textContent = msg.thinking;
                            updateThinkingDisplay(messageDiv);
                        }
                    }

                    // Render markdown for content
                    const contentDiv = messageDiv.querySelector('.message-content');
                    let content = msg.content;
                    if (contentDiv) {
                        // contentDiv.innerHTML = renderMarkdown(contentDiv.textContent);
                        const renderer = smd.default_renderer(contentDiv);
                        const parser = smd.parser(renderer);
                        DOMPurify.sanitize(content);
                        smd.parser_write(parser, content);
                        smd.parser_end(parser);
                        applyLaTeX(contentDiv);
                    }
                } else {
                    addMessage(msg.role, msg.content);
                }
            }
        }

        // Check stream status and resume if needed
        async function checkStreamStatus() {
            if (!currentConversationId) return;

            try {
                const response = await fetch(`/api/chat/stream/status/${currentConversationId}`);
                const status = await response.json();

                // Get pointer from localStorage
                const pointer = parseInt(
                    localStorage.getItem(STORAGE_KEYS.POINTER(currentConversationId)) || '0',
                    10
                );

                // Resume if stream is active OR if cache is incomplete (streaming flag still true but backend stream done)
                if (status.streaming || isStreamingForConv(currentConversationId)) {
                    showStreamingBadge(true);
                    return await resumeStreamFromPosition(pointer);
                } else if (status.is_complete) {
                    showStreamingBadge(false);
                }
            } catch (error) {
                console.error('Failed to check stream status:', error);
            }
        }

        // Render cached chunks from localStorage before resuming stream
        function renderCachedChunks(convId) {
            const chunksCache = JSON.parse(
                localStorage.getItem(STORAGE_KEYS.CHUNKS(convId)) || '[]'
            );

            let assistantMessage = null;
            let rawContent = '';
            let hasReceivedTokens = false;
            let renderer = null, parser = null;

            for (const data of chunksCache) {
                if (data.type === 'user') {
                    // Render user message
                    addMessage('user', data.content);
                } else if (data.chunk) {
                    if (!assistantMessage) {
                        assistantMessage = addMessage('assistant', '');
                    }

                    if (data.type === 'thinking') {
                        const thinkingElement = assistantMessage.querySelector('.thinking-content');
                        if (thinkingElement) {
                            thinkingElement.textContent += data.chunk;
                            updateThinkingDisplay(assistantMessage);
                        }
                    } else if (data.type === 'token') {
                        hasReceivedTokens = true;
                        rawContent += data.chunk;
                        const contentDiv = assistantMessage.querySelector('.message-content');
                        if (contentDiv) {
                            const result = renderContent(contentDiv, rawContent, renderer, parser);
                            if (result) {
                                [renderer, parser] = result;
                                end_parser(smd, parser);
                            }
                        }
                    }
                }
            }

            messagesContainer.scrollTop = messagesContainer.scrollHeight;
            return {assistantMessage, rawContent};
        }

        // Resume stream from specific position
        // case 1: switch off and back to the running conversation
        // case 2: refresh the page
        async function resumeStreamFromPosition(pointer) {
            if (!currentConversationId) return;

            // First, render cached chunks from localStorage
            const { assistantMessage: cachedAssistant, rawContent: cachedRawContent } = renderCachedChunks(currentConversationId);

            // Mark this conversation as streaming (for safety check in processStreamResponse)
            setStreamingForConv(currentConversationId, true);
            showStreamingBadge(true);

            try {
                // Call stream with single pointer parameter
                const url = `/api/chat/stream/${currentConversationId}?from_pointer=${pointer}`;
                const response = await fetch(url);
                if (!response.ok) {
                    throw new Error(`Stream request failed: ${response.status} ${response.statusText}`);
                }
                // Pass cached assistant message and raw content to continue from where we left off
                await processStreamResponse(response, true, cachedAssistant, cachedRawContent);
            } catch (error) {
                console.error('Stream error:', error);
                setStreamingForConv(currentConversationId, false);
                showStreamingBadge(false);
                return false;
            }

            // Clear streaming state when done
            setStreamingForConv(currentConversationId, false);
            showStreamingBadge(false);
            return true;
        }

        // Show/hide streaming badge on conversation item
        function showStreamingBadge(show) {
            const activeItem = document.querySelector(`.conversation-item[data-id="${currentConversationId}"]`);
            if (!activeItem) return;

            let badge = activeItem.querySelector('.streaming-badge');
            if (show && !badge) {
                badge = document.createElement('span');
                badge.className = 'streaming-badge';
                badge.textContent = 'Streaming';
                activeItem.appendChild(badge);
            } else if (!show && badge) {
                badge.remove();
            }
        }

        // Start new chat
        async function startNewChat() {
            currentConversationId = null;
            localStorage.removeItem('currentConversationId');
            messagesContainer.innerHTML = '';
            messagesContainer.classList.add('empty');
            document.querySelectorAll('.conversation-item').forEach(el => el.classList.remove('active'));
            messageInput.focus();
        }

        // Delete conversation
        async function deleteConversation(convId) {
            if (!confirm('Delete this conversation?')) return;

            try {
                // Clear all caches including history
                clearHistoryCache(convId);
                localStorage.removeItem(STORAGE_KEYS.CHUNKS(convId));
                localStorage.removeItem(STORAGE_KEYS.POINTER(convId));
                localStorage.removeItem(STORAGE_KEYS.STREAMING(convId));

                await fetch(`/api/chat/conversation/${convId}`, { method: 'DELETE' });

                delete conversations[convId];
                const item = document.querySelector(`.conversation-item[data-id="${convId}"]`);
                if (item) item.remove();

                if (convId === currentConversationId) {
                    await startNewChat();
                }
            } catch (error) {
                console.error('Failed to delete conversation:', error);
            }
        }

        // Send message
        async function sendMessage() {
            const message = messageInput.value.trim();
            if (!message) return;

            if (!currentConversationId) {
                currentConversationId = crypto.randomUUID();
                localStorage.setItem('currentConversationId', currentConversationId);
            }

            // Check if this conversation is already streaming
            if (isStreamingForConv(currentConversationId)) return;

            messageInput.value = '';
            messageInput.style.height = '';
            sendButton.disabled = true;

            addMessage('user', message);

            // Cache user message in history cache
            appendToHistoryCache(currentConversationId, { role: 'user', content: message });

            // Create assistant message placeholder immediately
            const assistantMessage = addAssistantPlaceholder();
            messagesContainer.scrollTop = messagesContainer.scrollHeight;

            // Cache user message
            const userChunksCache = JSON.parse(
                localStorage.getItem(STORAGE_KEYS.CHUNKS(currentConversationId)) || '[]'
            );
            userChunksCache.push({ type: 'user', content: message });
            localStorage.setItem(
                STORAGE_KEYS.CHUNKS(currentConversationId),
                JSON.stringify(userChunksCache)
            );

            // Clear pointer for new stream
            localStorage.setItem(
                STORAGE_KEYS.POINTER(currentConversationId),
                '0'
            );

            // Mark this conversation as streaming
            setStreamingForConv(currentConversationId, true);
            showStreamingBadge(true);

            try {
                const response = await fetch('/api/chat/stream', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message,
                        conversation_id: currentConversationId
                    })
                });

                if (!response.ok) {
                    throw new Error('Failed to get response');
                }

                await loadConversationList();
                await processStreamResponse(response, false, assistantMessage);

            } catch (error) {
                // Remove placeholder on error
                if (assistantMessage && assistantMessage.parentNode) {
                    assistantMessage.remove();
                }
                addMessage('assistant', 'Sorry, an error occurred. Please try again.');
                console.error('Error:', error);
            }

            // Clear streaming state when done (normal completion or error)
            setStreamingForConv(currentConversationId, false);
            showStreamingBadge(false);
            sendButton.disabled = false;
            messageInput.focus();
        }

        // Process SSE stream response
        async function processStreamResponse(response, isResume, existingMessage = null, existingRawContent = '') {
            // Capture conversationId at start - only process if this conversation is still current
            const convId = currentConversationId;
            if (!convId) return;

            // For non-resume streams, check if this conversation is still marked as streaming
            // For resume, we always process (resume is explicitly requested)
            if (!isResume && !isStreamingForConv(convId)) {
                return;
            }

            const reader = response.body.getReader();
            const decoder = new TextDecoder();
            let assistantMessage = existingMessage;
            let currentPointer = 0;
            let rawContent = existingRawContent;
            let thinkingContent = '';

            // Get current pointer from localStorage
            currentPointer = parseInt(localStorage.getItem(STORAGE_KEYS.POINTER(convId)) || '0', 10);

            while (true) {
                // Check if we're still on the same conversation (user may have switched)
                if (convId !== currentConversationId) {
                    // Conversation changed, stop processing this stream but keep it cached for later resume
                    return;
                }

                const { done, value } = await reader.read();
                if (done) break;

                const chunk = decoder.decode(value);
                const lines = chunk.split('\n');
                let renderer = null, parser = null;

                for (const line of lines) {
                    if (line.startsWith('data: ')) {
                        try {
                            const data = JSON.parse(line.slice(6));

                            if (data.chunk) {
                                if (!assistantMessage) {
                                    assistantMessage = addMessage('assistant', '');
                                }

                                if (data.type === 'thinking') {
                                    // Update thinking section
                                    const thinkingElement = assistantMessage.querySelector('.thinking-content');
                                    if (thinkingElement) {
                                        thinkingElement.textContent += data.chunk;
                                        thinkingContent += data.chunk;
                                        updateThinkingDisplay(assistantMessage);
                                    }
                                } else if (data.type === 'token') {
                                    // Remove loading indicator when receiving tokens
                                    const contentDiv = assistantMessage.querySelector('.message-content');
                                    if (contentDiv) {
                                        // Clear loading innerHTML only once on first token
                                        if (contentDiv.classList.contains('loading')) {
                                            contentDiv.innerHTML = '';
                                        }
                                        contentDiv.classList.remove('loading');
                                    }
                                    // Accumulate raw content during streaming
                                    rawContent += data.chunk;
                                    // Use insertAdjacentText for efficient text appending during streaming
                                    // (following Chrome best practices - avoids re-parsing entire content)
                                    if (contentDiv) {
                                        //contentDiv.insertAdjacentText('beforeend', data.chunk);
                                        contentDiv.innerHTML = renderMarkdown(rawContent);
                                        // renderer, parser = renderContent(contentDiv, rawContent, renderer, parser);
                                    }
                                    messagesContainer.scrollTop = messagesContainer.scrollHeight;
                                }

                                // Cache chunk and increment pointer using captured convId
                                const chunksCache = JSON.parse(
                                    localStorage.getItem(STORAGE_KEYS.CHUNKS(convId)) || '[]'
                                );
                                chunksCache.push(data);
                                localStorage.setItem(
                                    STORAGE_KEYS.CHUNKS(convId),
                                    JSON.stringify(chunksCache)
                                );
                                currentPointer++;
                                localStorage.setItem(
                                    STORAGE_KEYS.POINTER(convId),
                                    currentPointer.toString()
                                );
                            } else if (data.end) {
                                // End of stream - clear pointer and streaming state (keep chunks cached)
                                localStorage.removeItem(STORAGE_KEYS.POINTER(convId));
                                setStreamingForConv(convId, false);
                                // Final markdown parse and cleanup
                                if (assistantMessage) {
                                    const contentDiv = assistantMessage.querySelector('.message-content');
                                    const thinkingSection = assistantMessage.querySelector('.thinking-section');
                                    const thinkingContent = thinkingSection?.querySelector('.thinking-content');

                                    if (contentDiv) {
                                        // contentDiv.classList.remove('loading');
                                        // Filter out any thinking content that might have leaked into rawContent
                                        const finalContent = rawContent.trim();
                                        if (finalContent) {
                                            contentDiv.innerHTML = renderMarkdown(finalContent);
                                            // renderer, parser = renderContent(contentDiv, rawContent, renderer, parser);
                                            // end_parser(smd, parser);
                                        } else {
                                            contentDiv.innerHTML = '';
                                        }
                                    }

                                    // Hide thinking section if it only contains the thinking indicator text
                                    if (thinkingContent && thinkingSection) {
                                        const thinkingText = thinkingContent.textContent.trim();
                                        // If thinking content is empty or just placeholder, hide the section
                                        if (!thinkingText) {
                                            thinkingSection.style.display = 'none';
                                        }
                                    }
                                }
                                // Append assistant message to history cache
                                appendToHistoryCache(convId, {
                                    role: 'assistant',
                                    content: rawContent.trim(),
                                    thinking: thinkingContent || undefined
                                });
                                return;
                            }
                        } catch (e) {
                            // Ignore parse errors
                        }
                    }
                }
            }
        }

        function addMessage(role, content) {
            // Create wrapper div for avatar + message bubble
            const wrapperDiv = document.createElement('div');
            wrapperDiv.className = `message-wrapper ${role}`;

            // Avatar SVG icon
            const avatar = document.createElement('div');
            avatar.className = 'avatar';
            if (role === 'assistant') {
                avatar.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8V4H8"/><rect x="2" y="8" width="20" height="12" rx="2"/><circle cx="8" cy="14" r="1.5"/><circle cx="16" cy="14" r="1.5"/><path d="M9 18h6"/><path d="M12 2v2"/></svg>`;
            } else {
                avatar.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/></svg>`;
            }

            // Message bubble (the actual content container)
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role}`;

            const bodyDiv = document.createElement('div');
            bodyDiv.className = 'message-body';

            if (role === 'assistant') {
                // Create thinking section
                const thinkingSection = document.createElement('div');
                thinkingSection.className = 'thinking-section';

                const thinkingContent = document.createElement('div');
                thinkingContent.className = 'thinking-content';
                thinkingContent.textContent = '';

                const toggleBtn = document.createElement('button');
                toggleBtn.className = 'thinking-toggle';
                toggleBtn.textContent = 'Show more';
                toggleBtn.style.display = 'none';

                thinkingSection.appendChild(thinkingContent);
                thinkingSection.appendChild(toggleBtn);

                // Create message content
                const contentDiv = document.createElement('div');
                contentDiv.className = 'message-content';
                contentDiv.textContent = content;

                bodyDiv.appendChild(thinkingSection);
                bodyDiv.appendChild(contentDiv);
            } else {
                const contentDiv = document.createElement('div');
                contentDiv.className = 'message-content';
                contentDiv.textContent = content;
                bodyDiv.appendChild(contentDiv);
            }

            messageDiv.appendChild(bodyDiv);

            // Wrapper contains avatar and bubble as siblings
            wrapperDiv.appendChild(avatar);
            wrapperDiv.appendChild(messageDiv);

            messagesContainer.appendChild(wrapperDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;

            // Remove empty class when messages exist
            messagesContainer.classList.remove('empty');

            // Setup scrollbar auto-hide for assistant messages
            if (role === 'assistant') {
                setupScrollbarAutoHide(messageDiv);
            }

            return messageDiv;
        }

        // Create assistant message placeholder with loading indicator
        function addAssistantPlaceholder() {
            // Create wrapper div for avatar + message bubble
            const wrapperDiv = document.createElement('div');
            wrapperDiv.className = 'message-wrapper assistant';

            // Avatar SVG icon
            const avatar = document.createElement('div');
            avatar.className = 'avatar';
            avatar.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8V4H8"/><rect x="2" y="8" width="20" height="12" rx="2"/><circle cx="8" cy="14" r="1.5"/><circle cx="16" cy="14" r="1.5"/><path d="M9 18h6"/><path d="M12 2v2"/></svg>`;

            // Message bubble
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message assistant';

            const bodyDiv = document.createElement('div');
            bodyDiv.className = 'message-body';

            // Create thinking section
            const thinkingSection = document.createElement('div');
            thinkingSection.className = 'thinking-section';

            const thinkingContent = document.createElement('div');
            thinkingContent.className = 'thinking-content';
            thinkingContent.textContent = '';

            const toggleBtn = document.createElement('button');
            toggleBtn.className = 'thinking-toggle';
            toggleBtn.textContent = 'Show more';
            toggleBtn.style.display = 'none';

            thinkingSection.appendChild(thinkingContent);
            thinkingSection.appendChild(toggleBtn);

            // Create message content with loading state
            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content loading';
            contentDiv.innerHTML = '<span>Thinking</span><div class="loading-dots"><span></span><span></span><span></span></div>';

            bodyDiv.appendChild(thinkingSection);
            bodyDiv.appendChild(contentDiv);

            messageDiv.appendChild(bodyDiv);

            // Wrapper contains avatar and bubble as siblings
            wrapperDiv.appendChild(avatar);
            wrapperDiv.appendChild(messageDiv);

            messagesContainer.appendChild(wrapperDiv);
            messagesContainer.classList.remove('empty');
            setupScrollbarAutoHide(messageDiv);

            return messageDiv;
        }

        function updateThinkingDisplay(messageElement) {
            const thinkingSection = messageElement.querySelector('.thinking-section');
            if (!thinkingSection) return;

            const thinkingContent = thinkingSection.querySelector('.thinking-content');
            const toggleBtn = thinkingSection.querySelector('.thinking-toggle');
            if (!thinkingContent || !toggleBtn) return;

            // Check if content exceeds 3 lines
            const lines = countLines(thinkingContent);
            const shouldCollapse = lines > 3;

            if (shouldCollapse) {
                thinkingSection.classList.add('thinking-collapsed');
                toggleBtn.style.display = 'block';
                toggleBtn.textContent = 'Show more';
            } else {
                thinkingSection.classList.remove('thinking-collapsed');
                toggleBtn.style.display = 'none';
            }

            // Setup toggle button handler
            toggleBtn.onclick = () => {
                const isCollapsed = thinkingSection.classList.contains('thinking-collapsed');
                if (isCollapsed) {
                    thinkingSection.classList.remove('thinking-collapsed');
                    toggleBtn.textContent = 'Show less';
                } else {
                    thinkingSection.classList.add('thinking-collapsed');
                    toggleBtn.textContent = 'Show more';
                }
            };
        }

        function countLines(element) {
            const style = window.getComputedStyle(element);
            const lineHeight = parseFloat(style.lineHeight);
            const height = element.scrollHeight;
            return Math.round(height / lineHeight);
        }

        function setupScrollbarAutoHide(messageElement) {
            if (!messageElement) return;

            // Check if already has scrollbar (content overflows)
            const hasOverflow = messageElement.scrollHeight > messageElement.clientHeight;
            if (!hasOverflow) return;

            messageElement.addEventListener('wheel', function() {
                this.classList.add('scrollbar-visible');
                clearTimeout(this._hideTimer);
                this._hideTimer = setTimeout(() => {
                    this.classList.remove('scrollbar-visible');
                }, 3000);
            }, { passive: true });
        }

        // Event listeners
        sendButton.addEventListener('click', sendMessage);
        messageInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
        messageInput.addEventListener('input', function() {
            autoResizeInput(this);
        });
        newChatBtn.addEventListener('click', startNewChat);
        toggleSidebar.addEventListener('click', () => sidebar.classList.toggle('collapsed'));
        toggleSidebarMain.addEventListener('click', () => sidebar.classList.toggle('collapsed'));

        function autoResizeInput(textarea) {
            // Check if field-sizing is supported
            if (typeof CSS !== 'undefined' && CSS.supports('field-sizing', 'content')) {
                return;
            }

            // Fallback: adjust height based on content
            const minHeight = 120;
            const clone = textarea.cloneNode();
            clone.style.position = 'absolute';
            clone.style.visibility = 'hidden';
            clone.style.width = textarea.offsetWidth + 'px';
            clone.style.height = 'auto';
            clone.style.minHeight = '0';
            document.body.appendChild(clone);
            const newHeight = Math.max(minHeight, clone.scrollHeight);
            document.body.removeChild(clone);
            textarea.style.height = newHeight + 'px';
        }

        // Initialize
        init();
    </script>
</body>
</html>
